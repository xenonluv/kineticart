# 키네틱 아트 원천 파일서버
#   /works/  → 원본 이미지 (image_url 이 가리키는 곳)
#   /texts/  → 한글 상세 설명 원문 (detail_text_url)
# 웹앱(다른 도메인)이 이미지를 불러올 수 있도록 CORS 허용, 텍스트는 UTF-8.
server {
    listen 8787;
    server_name _;

    # 헬스체크 (컨테이너 상태 확인용)
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 원본 이미지
    location /works/ {
        alias /srv/works/;
        autoindex off;                                   # 폴더 목록 노출 방지
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=86400" always;
        if ($request_method = OPTIONS) { return 204; }   # CORS preflight
    }

    # AI 생성 이미지
    location /generated/ {
        alias /srv/generated/;
        autoindex off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # 원본 설명 텍스트 (UTF-8)
    location /texts/ {
        alias /srv/texts/;
        autoindex off;
        charset utf-8;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=86400" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # 그 외 경로(루트 포함)는 차단
    location / { return 404; }
}
