# 키네틱 아트 원천 파일서버
#   /works/  → 원본 이미지 (image_url 이 가리키는 곳)
#   /texts/  → 한글 상세 설명 원문 (detail_text_url)
# 웹앱(다른 도메인)이 이미지를 불러올 수 있도록 CORS 허용, 텍스트는 UTF-8.
server {
    listen 8787;
    server_name _;

    # 헬스체크 (컨테이너 상태 확인용)
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 원본 이미지
    location /works/ {
        alias /srv/works/;
        autoindex off;                                   # 폴더 목록 노출 방지
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=86400" always;
        if ($request_method = OPTIONS) { return 204; }   # CORS preflight
    }

    # 웹 표시용 파생본 (2b_derivatives.py) — 카드 480 / 썸네일 768(내부·참조) / 상세 1600 WebP.
    # URL 에 ?v=<내용해시> 가 붙으므로 내용이 바뀌면 URL 이 바뀐다 → 1년 immutable 캐시 안전.
    # Cloudflare 엣지가 캐시해 재방문 시 집 Mac 업로드 회선을 쓰지 않는다.
    location /cards/ {
        alias /srv/cards/;
        autoindex off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=31536000, immutable";   # 2xx/3xx 에만(404 는 캐시 안 함)
        if ($request_method = OPTIONS) { return 204; }
    }
    location /thumbs/ {
        alias /srv/thumbs/;
        autoindex off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=31536000, immutable";   # 2xx/3xx 에만(404 는 캐시 안 함)
        if ($request_method = OPTIONS) { return 204; }
    }
    location /display/ {
        alias /srv/display/;
        autoindex off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=31536000, immutable";   # 2xx/3xx 에만(404 는 캐시 안 함)
        if ($request_method = OPTIONS) { return 204; }
    }

    # AI 생성 이미지
    location /generated/ {
        alias /srv/generated/;
        autoindex off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Cache-Control "public, max-age=86400" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # 원본 설명 텍스트 (UTF-8)
    location /texts/ {
        alias /srv/texts/;
        autoindex off;
        charset utf-8;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=86400" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # 그 외 경로(루트 포함)는 차단
    location / { return 404; }
}
